#start p{max-width:420px;font-size:13px;opacity:.8;line-height:1.6}#start button{font:inherit;font-size:20px;color:#04200e;background:#39ff8f;border:0;border-radius:8px;padding:12px 36px}

addEventListener('resize',fit);

[...el.children].forEach((d,i)=>{const c=t[i];if(d.className=='dg')d.firstChild.style.transform='translateY(-'+(+c)+'em)';else d.textContent=c})}

const GC=[83,68],GR=56,GS=GR/1.2,gs=$('ggs');
el_('circle',{cx:GC[0],cy:GC[1],r:GR,fill:'none',stroke:'currentColor','stroke-opacity':.7},gs);

[.4,.8].forEach(g=>el_('circle',{cx:GC[0],cy:GC[1],r:GS*g,fill:'none',stroke:'currentColor','stroke-opacity':.25},gs));
ln(gs,{x1:GC[0]-GR,y1:GC[1],x2:GC[0]+GR,y2:GC[1],stroke:'currentColor','stroke-opacity':.4});
ln(gs,{x1:GC[0],y1:GC[1]-GR,x2:GC[0],y2:GC[1]+GR,stroke:'currentColor','stroke-opacity':.4});
const gmu=el_('circle',{cx:GC[0],cy:GC[1],r:GS,fill:'none',stroke:'currentColor','stroke-dasharray':'3 3','stroke-opacity':.85},gs);
const gtr=el_('polyline',{fill:'none',stroke:'currentColor','stroke-width':1.2,'stroke-opacity':.7},gs);
const gdt=el_('circle',{cx:GC[0],cy:GC[1],r:4,fill:'currentColor'},gs);
[['G-G',4,10,'start'],['ACC',83,10,'middle'],['BRK',83,131,'middle']].forEach(a=>{const t=el_('text',{x:a[1],y:a[2],'font-size':9,'text-anchor':a[3],fill:'currentColor','fill-opacity':.65},gs);t.textContent=a[0]});
const mut=el_('text',{x:162,y:11,'font-size':11,'text-anchor':'end',fill:'currentColor'},gs),mul=el_('text',{x:162,y:21,'font-size':8,'text-anchor':'end',fill:'currentColor','fill-opacity':.75},gs);
for(let k=0;k<=8;k++){const y=4+k*8,l=k==4?12:6;ln($('rrt'),{x1:40,y1:y,x2:40+l,y2:y,'stroke-width':k==4?2:1})}
for(const id of['bF','bR'])for(let i=0;i<18;i++){const s=document.createElement('div');s.className='sg';$(id).appendChild(s)}
const P={cg:1,mu:1.05,auto:1,hang:4.5,hold:10,sign:1,hz:1,comp:1,fs:.48,hl:.47,Ltan:1.325*Math.tan(rad(25.65))};
const S={u:[0,1,0],u0:null,w:[0,0,0],a:[0,0,0],v:null,glat:null,glon:null,gh:null,ght:0,mh:null,mht:0,off:null,hd:null,hsrc:'--',lean:0,lat:0,lon:0,mL:0,mR:0,tL:0,tR:0,bL:0,bR:0,pb:0,pa:0,rr:0,pl:0,pit:0,yaw:0,rad:null,t:0,over:false,bl:0,run:false,cs:0,csd:'R',cpk:0,ct:0,log:[],hl:[],hg:[],tr:[],wf:1,wlab:'NO WX',wxT:null,wxLat:null,wxLon:null,wxBusy:0};
try{const b=JSON.parse(localStorage.getItem('r15best')||'{}');S.bL=b.L||0;S.bR=b.R||0}catch(e){}
const sv=()=>{try{localStorage.setItem('r15best',JSON.stringify({L:S.bL,R:S.bR}))}catch(e){}};
const angd=(a,b)=>((a-b+540)%360)-180;
function onOri(e){if(e.beta==null)return;S.seen=1;const b=rad(e.beta),g=rad(e.gamma||0);S.u=[-Math.cos(b)*Math.sin(g),Math.sin(b),Math.cos(b)*Math.cos(g)];if(!S.u0)S.u0=S.u.slice()}
function onAbs(e){if(e.alpha==null||e.beta==null)return;const a=rad(e.alpha),b=rad(e.beta),g=rad(e.gamma||0);

function estMu(w){

async function wx(){

$('flip').onclick=()=>{P.sign*=-1};
$('hzi').onclick=()=>{P.hz*=-1;$('hzi').textContent='HZ: '+(P.hz==1?'NORM':'INV')};
$('comp').onclick=()=>{P.comp=P.comp==1?-1:P.comp==-1?0:1;$('comp').textContent='COMP: '+(P.comp==1?'ON':P.comp==-1?'INV':'OFF')};
$('cgn').onclick=()=>{P.cg=P.cg==1?1.3:P.cg==1.3?1.6:P.cg==1.6?.7:1;$('cgn').textContent='STEER '+Math.round(P.cg*100)+'%'};
$('mua').onclick=()=>{P.auto^=1;$('mua').textContent='MU: '+(P.auto?'AUTO':'MAN')};
$('mu').onclick=()=>{P.mu=P.mu>=1.3?.85:+(P.mu+.05).toFixed(2);$('mu').textContent='MU '+P.mu.toFixed(2)};
$('wxb').onclick=()=>{S.wxT=null;wx()};
$('hang').onclick=()=>{P.hang=P.hang>=6?0:P.hang+1.5;$('hang').textContent='HANG '+P.hang+'°'};
$('hold').onclick=()=>{P.hold=P.hold==5?10:P.hold==10?30:5;$('hold').textContent='HOLD '+P.hold+'S'};
$('rst').onclick=()=>{S.mL=S.mR=0;S.pb=S.pa=0};$('rstb').onclick=()=>{S.bL=S.bR=0;sv()};$('fitb').onclick=()=>{FIT=FIT==1?.92:FIT==.92?.85:1;$('fitb').textContent='FIT '+Math.round(FIT*100)+'%';fit()};
const lp=(a,b,k)=>a+(b-a)*k,p2=n=>String(Math.round(n)).padStart(2,'0'),p3=n=>String(Math.min(999,Math.round(n))).padStart(3,'0'),sg=(x,d)=>(x<0?'-':'+')+Math.abs(x).toFixed(d);
function frame(){
const u=S.u,u0=S.u0||[0,1,0],tn=performance.now(),dt=Math.min(.1,(tn-(S.t||tn))/1000);S.t=tn;
const h0=Math.hypot(u0[0],u0[1])||1;
let raw=Math.atan2((u0[0]*u[1]-u0[1]*u[0])/h0,u0[0]*u[0]+u0[1]*u[1]+u0[2]*u[2])*180/Math.PI*P.sign;
const v=S.v,w=S.w[0]*u[0]+S.w[1]*u[1]+S.w[2]*u[2];
let cor=0;if(P.comp&&v>3)cor=Math.max(-12,Math.min(12,P.cg*P.Ltan*w/v*180/Math.PI))*P.comp*P.sign;
S.lean=lp(S.lean,raw-cor,.25);
S.rr=lp(S.rr,dt>0?(S.lean-S.pl)/dt:0,.15);S.pl=S.lean;
const cl_=x=>Math.max(-1,Math.min(1,x)),pit=(Math.asin(cl_(u[2]))-Math.asin(cl_(u0[2])))*180/Math.PI;S.pit=lp(S.pit,pit,.15);
S.yaw=lp(S.yaw,Math.abs(w)*180/Math.PI,.2);S.rad=(v!=null&&v>3&&Math.abs(w)>.03)?v/Math.abs(w):null;
const nowMs=Date.now(),mv=S.mh!=null&&nowMs-S.mht<2000;
if(mv&&S.gh!=null&&v!=null&&v>3&&S.yaw<8&&nowMs-S.ght<3000){const d=angd(S.gh,S.mh);S.off=S.off==null?d:angd(S.off+angd(d,S.off)*.02,0)}
let tg=null;
if(mv){tg=(S.mh+(S.off||0)+360)%360;S.hsrc=S.off==null?'MAG':'MAG+GPS'}
else if(S.gh!=null&&nowMs-S.ght<5000){tg=S.gh;S.hsrc='GPS'}
if(tg!=null)S.hd=S.hd==null?tg:(S.hd+angd(tg,S.hd)*.15+360)%360;
const hn=Math.hypot(u[0],u[1])||1,lat=(S.a[0]*-u[1]+S.a[1]*u[0])/hn/9.81*P.sign,lon=-S.a[2]/9.81;
S.lat=lp(S.lat,lat,.2);S.lon=lp(S.lon,lon,.2);
const wage=S.wxT==null?null:(nowMs-S.wxT)/60000,wxOk=wage!=null&&wage<45,muE=(P.auto&&wxOk)?P.mu*S.wf:P.mu;
const ay=Math.abs(S.lat),ax=S.lon,Ff=Math.max(.08,P.fs-P.hl*ax),Fr=Math.max(.08,1-P.fs+P.hl*ax);
const Lf=Math.hypot(ax<0?-ax:0,P.fs*ay)/(muE*Ff)*100,Lr=Math.hypot(ax>0?ax:0,(1-P.fs)*ay)/(muE*Fr)*100,L=Math.max(Lf,Lr);
const b=S.lean,a=Math.abs(b),now=nowMs,lim=Math.max(0,Math.round(Math.atan(muE)*180/Math.PI-P.hang));
if(S.run){if(b<0&&a>=S.mL){S.mL=a;S.tL=now}if(b>0&&a>=S.mR){S.mR=a;S.tR=now}
if(b<0&&a>S.bL){S.bL=a;sv()}if(b>0&&a>S.bR){S.bR=a;sv()}
if(ax<0)S.pb=Math.max(S.pb,-ax);if(ax>0)S.pa=Math.max(S.pa,ax);
const sd=b>0?'R':'L';
if(!S.cs){if(a>12){S.cs=1;S.csd=sd;S.cpk=a;S.ct=now}}
else{S.cpk=Math.max(S.cpk,a);if(a<8||(a>3&&sd!=S.csd)){const du=(now-S.ct)/1000;if(du>=1){S.log.unshift({pk:S.cpk,d:du,s:S.csd});S.log.length=Math.min(S.log.length,3)}S.cs=0}}}
const fl=t=>Math.max(0,1-(now-t)/(P.hold*1000));
if(S.mL&&!fl(S.tL)){S.mL=b<0?a:0;S.tL=now}if(S.mR&&!fl(S.tR)){S.mR=b>0?a:0;S.tR=now}
const col=L>95?'#ff4a4a':L>85?'#ff9a2e':L>60?'#ffe14a':'#39ff8f';st.style.color=col;S.over=L>95;
const pos=(deg,len)=>[CX+len*Math.sin(rad(deg)),CY-len*Math.cos(rad(deg))];
$('ptr').setAttribute('transform','translate('+pos(b,R)+') rotate('+(180+b)+')');
$('lim').setAttribute('transform','translate('+pos(lim,R+18)+') rotate('+(180+lim)+')');
[['xL',-S.bL],['xR',S.bR]].forEach(([id,d])=>{const p1=pos(d,R-8),p2_=pos(d,R+18);const e=$(id);e.setAttribute('x1',p1[0]);e.setAttribute('y1',p1[1]);e.setAttribute('x2',p2_[0]);e.setAttribute('y2',p2_[1])});
$('hz').setAttribute('transform','rotate('+(-b*P.hz)+' '+CX+' '+CY+')');
$('fpm').setAttribute('transform','translate('+(CX+S.lat*P.sign*40)+','+(CY-ax*50)+')');
const bx=Math.max(-77,Math.min(77,b/60*77)),lx=Math.min(77,lim/60*77);
$('lbf').setAttribute('x',bx>=0?85:85+bx);$('lbf').setAttribute('width',Math.abs(bx));
$('lmL').setAttribute('x1',85-lx);$('lmL').setAttribute('x2',85-lx);$('lmR').setAttribute('x1',85+lx);$('lmR').setAttribute('x2',85+lx);
$('rrm').setAttribute('transform','translate(0,'+(36-cl_(S.rr/80)*32)+')');
gmu.setAttribute('r',Math.min(GR*1.06,muE*GS));
mut.textContent='\u03bc'+muE.toFixed(2);mul.textContent=!P.auto?'MAN':(wxOk?S.wlab+' '+Math.round(wage)+'M':'NO WX');
const n=v=>Math.round(Math.min(v,100)/100*18);
[['bF',Lf],['bR',Lr]].forEach(([id,v])=>[...$(id).children].forEach((s,i)=>s.classList.toggle('on',17-i<n(v))));
roll($('pf'),p3(Lf));roll($('pr'),p3(Lr));
roll($('cur'),p2(a));roll($('lm'),p2(lim));roll($('mg'),p2(Math.max(0,lim-a)));
roll($('mL'),p2(S.mL));roll($('mR'),p2(S.mR));
roll($('gy'),Math.abs(S.lat).toFixed(2));roll($('gx'),sg(ax,2));
roll($('pk1'),S.pb.toFixed(2));roll($('pk2'),S.pa.toFixed(2));
roll($('yw'),p3(S.yaw));roll($('rd'),S.rad==null||S.rad>999?'---':p3(S.rad));
roll($('hdg'),S.hd==null?'---':p3(Math.round(S.hd)%360));
$('cg').setAttribute('transform','translate('+(CWm-(S.hd||0)*TS)+',0)');
$('gps').textContent=(v==null?'GPS --':'GPS '+p3(v*3.6)+'KMH')+' '+S.hsrc;
roll($('rr'),(S.rr<0?'-':'+')+p2(Math.min(99,Math.abs(S.rr))));
roll($('pit'),sg(S.pit,1)+'°');
$('hL').style.transform='scaleX('+(S.mL?fl(S.tL):0)+')';$('hR').style.transform='scaleX('+(S.mR?fl(S.tR):0)+')';
const rows=[];if(S.cs)rows.push('>'+p2(S.cpk)+'° '+((now-S.ct)/1000).toFixed(1)+'S '+S.csd);
S.log.forEach(l=>rows.push(p2(l.pk)+'° '+l.d.toFixed(1)+'S '+l.s));
$('cl').textContent=rows.slice(0,3).join('\n');
$('cb').textContent='BEST L'+p2(S.bL)+' R'+p2(S.bR);
requestAnimationFrame(frame)}
setInterval(()=>{S.bl^=1;st.style.opacity=S.over&&S.bl?.35:1},320);
setInterval(()=>{
const x=GC[0]+Math.max(-GR*1.1,Math.min(GR*1.1,S.lat*GS)),y=GC[1]-Math.max(-GR*1.1,Math.min(GR*1.1,S.lon*GS));
S.tr.push(x.toFixed(1)+','+y.toFixed(1));if(S.tr.length>60)S.tr.shift();
gtr.setAttribute('points',S.tr.join(' '));gdt.setAttribute('cx',x);gdt.setAttribute('cy',y)},50);
setInterval(()=>{
S.hl.push(S.lean);S.hg.push(S.lon);if(S.hl.length>100){S.hl.shift();S.hg.shift()}
const mk=(arr,k)=>arr.map((v,i)=>(4+i*CH/99).toFixed(1)+','+(31-Math.max(-1,Math.min(1,v/k))*16).toFixed(1)).join(' ');
$('chL').setAttribute('points',mk(S.hl,60));$('chG').setAttribute('points',mk(S.hg,1))},100);
setInterval(wxTick,30000);
fit();frame();
</script></body></html>
